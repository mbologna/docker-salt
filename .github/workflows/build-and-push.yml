name: Build and Push

# Both images build through mbologna/.github's docker-ci.yml, once per Dockerfile.
# Their version is the Salt release the image installs, read from the built
# image (version_command) and added as tags such as 3007 and 3007.2.

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "0 4 * * 0"
  # auto-release (release.yml) starts the tag build this way.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The images are published as docker.io/<DOCKER_USERNAME>/<image>, which must
  # stay mbologna/saltstack-{master,minion} so existing consumers (e.g.
  # SUSE/salt-netapi-client) keep working. Only the default branch and release
  # tags reach Docker Hub; other branches stop at GHCR.
  master:
    if: github.event_name != 'schedule'
    uses: mbologna/.github/.github/workflows/docker-ci.yml@ba336cbe198c220e6b1bd08cfe8e4fedbc843bc0 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: saltstack-master
      dockerfile: Dockerfile-master
      version_command: salt-master --version | awk '{print $2}'
      push_to_dockerhub: ${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/') }}
      enable_integration_test: true
      enable_release_drafter: true
      yamllint_paths: .github/workflows/ docker-compose.yml
    secrets: inherit

  minion:
    if: github.event_name != 'schedule'
    uses: mbologna/.github/.github/workflows/docker-ci.yml@ba336cbe198c220e6b1bd08cfe8e4fedbc843bc0 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: saltstack-minion
      dockerfile: Dockerfile-minion
      version_command: salt-minion --version | awk '{print $2}'
      push_to_dockerhub: ${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/') }}
      yamllint_paths: .github/workflows/ docker-compose.yml
    secrets: inherit

  # A push to the default branch releases at once only a CVE fix: the wrapper
  # runs the security strategy, comparing the last release's image with the
  # latest just built above. Monday's release and manual runs are release.yml.
  security-release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [master, minion]
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@ba336cbe198c220e6b1bd08cfe8e4fedbc843bc0 # main
    with:
      strategy: docker
      image: docker.io/mbologna/saltstack-master
      dispatch_workflow: build-and-push.yml
    secrets: inherit

  cache-cleanup:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/cache-cleanup.yml@ba336cbe198c220e6b1bd08cfe8e4fedbc843bc0 # main
    with:
      max_age_days: 7
    permissions:
      actions: write
