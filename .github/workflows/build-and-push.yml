name: Build and Push

# Both images build through mbologna/.github's docker-ci.yml, once per Dockerfile.
# Their version is the Salt release the image installs, read from the built
# image (version_command) and added as tags such as 3007 and 3007.2.

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  # auto-release (release.yml) starts the tag build this way.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The images are published as docker.io/<DOCKER_USERNAME>/<image>, which must
  # stay mbologna/saltstack-{master,minion} so existing consumers (e.g.
  # SUSE/salt-netapi-client) keep working. Only release tags publish, to GHCR
  # and Docker Hub; pull requests build without pushing.
  master:
    uses: mbologna/.github/.github/workflows/docker-ci.yml@09bc881c557dd70bead1932e686f5dff713d4be4 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: saltstack-master
      # Only release tags publish the image (auto-release dispatches
      # their build); pull requests build it without pushing.
      publish: release
      dockerfile: Dockerfile-master
      version_command: salt-master --version | awk '{print $2}'
      # Image policy check: the master's salt-api authenticates a PAM user
      # from /etc/shadow, which only root can read.
      allow_root: >-
        test fixture for salt-netapi-client: salt-api authenticates a PAM
        user from /etc/shadow
      push_to_dockerhub: ${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/') }}
      enable_integration_test: true
      yamllint_paths: .github/workflows/ docker-compose.yml
    secrets: inherit

  minion:
    uses: mbologna/.github/.github/workflows/docker-ci.yml@09bc881c557dd70bead1932e686f5dff713d4be4 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image_name: saltstack-minion
      # Only release tags publish the image (auto-release dispatches
      # their build); pull requests build it without pushing.
      publish: release
      dockerfile: Dockerfile-minion
      version_command: salt-minion --version | awk '{print $2}'
      # Image policy check: the minion applies states as root.
      allow_root: >-
        test fixture for salt-netapi-client: the minion applies states as
        root
      push_to_dockerhub: ${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/') }}
      yamllint_paths: .github/workflows/ docker-compose.yml
    secrets: inherit

  # A push to the default branch releases at once only a CVE fix: the wrapper
  # runs the security strategy, comparing the base images of both Dockerfiles
  # with the last release's. Monday's release and manual runs are release.yml.
  security-release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [master, minion]
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@09bc881c557dd70bead1932e686f5dff713d4be4 # main
    with:
      strategy: conventional
      image: docker.io/mbologna/saltstack-master
      dockerfiles: Dockerfile-master Dockerfile-minion
      dispatch_workflow: build-and-push.yml
    secrets: inherit
