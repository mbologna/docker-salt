name: Auto Release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  auto-release:
    # Monday's schedule releases; a manual run on the default branch releases
    # at once. The tag build auto-release dispatches runs on the tag ref, so it
    # does not release again.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # contents: push the tag and create the Release; actions: start the image
    # build on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@38f7ca7d59dad7be2dfd5607f8758cd51bb41dd2 # main
    with:
      strategy: docker
      image: docker.io/mbologna/saltstack-master
      # The images build in build-and-push.yml. Dispatching this workflow on
      # the tag instead re-ran auto-release there: 995 tags on 2026-10-18.
      dispatch_workflow: build-and-push.yml
    secrets: inherit
